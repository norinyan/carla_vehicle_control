<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomous Vehicle Controller Benchmark</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c12;
    --surface: #0d1420;
    --border: #1a2540;
    --text: #c8d8f0;
    --muted: #4a6080;
    --lqr:   #38bdf8;
    --mpc:   #a78bfa;
    --pd:    #34d399;
    --pp:    #fb923c;
    --st:    #f472b6;
    --ref:   #ffffff;
    --grid:  rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: 40px 32px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    z-index: 0;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #e0f0ff 30%, #7eb8f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
    position: relative;
    background-color: var(--bg);
    padding: 0 20px;
    z-index: 1;
  }
  .header p {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .legend-dot {
    width: 28px;
    height: 2.5px;
    border-radius: 2px;
  }
  .legend-dot.dashed {
    background: repeating-linear-gradient(
      90deg, var(--ref) 0, var(--ref) 5px, transparent 5px, transparent 10px
    );
    height: 2px;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 20px 16px;
    position: relative;
    overflow: hidden;
  }
  .chart-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--border), rgba(56,189,248,0.3), var(--border));
  }
  .chart-card.traj {
    grid-column: 1 / -1;
  }
  .chart-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .chart-title span {
    color: var(--text);
  }
  canvas { display: block; }

  @media (max-width: 700px) {
    .charts-grid { grid-template-columns: 1fr; }
    .chart-card.traj { grid-column: 1; }
    body { padding: 20px 12px; }
    .header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Autonomous Vehicle Controller Benchmark</h1>
  <p>Lateral × Longitudinal · CARLA Simulator · Track Loop</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--lqr)"></div>LQR–PID</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--mpc)"></div>MPC–PID</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pd)"></div>PD–PID</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pp)"></div>Pure Pursuit–PID</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--st)"></div>Stanley–PID</div>
  <div class="legend-item"><div class="legend-dot dashed"></div>Reference</div>
</div>

<div class="charts-grid">

  <div class="chart-card">
    <div class="chart-title">Speed <span>m/s</span></div>
    <canvas id="speedChart" height="200"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-title">Yaw Error <span>deg</span></div>
    <canvas id="yawChart" height="200"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-title">Steering Output <span>[-1, 1]</span></div>
    <canvas id="steerChart" height="200"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-title">Acceleration Output <span>m/s²</span></div>
    <canvas id="accelChart" height="200"></canvas>
  </div>

  <div class="chart-card traj">
    <div class="chart-title">Trajectory Map <span>x–y</span></div>
    <canvas id="trajChart" height="260"></canvas>
  </div>

</div>

const COLORS = {

  'mpc-pid': '#a78bfa',
  'pd-pid':  '#34d399',
  'pp-pid':  '#fb923c',
  'st-pid':  '#f472b6',
};
const LABELS = {
  'lqr-pid': 'LQR–PID',
  'mpc-pid': 'MPC–PID',
  'pd-pid':  'PD–PID',
  'pp-pid':  'PP–PID',
  'st-pid':  'Stanley–PID',
};

const ORDER = ['lqr-pid','mpc-pid','pd-pid','pp-pid','st-pid'];

const baseOpts = {
  animation: { duration: 800, easing: 'easeOutQuart' },
  responsive: true,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: 'rgba(13,20,32,0.96)',
      borderColor: '#1a2540',
      borderWidth: 1,
      titleFont: { family: 'JetBrains Mono', size: 11 },
      bodyFont: { family: 'JetBrains Mono', size: 11 },
      padding: 10,
    }
  },
  scales: {
    x: {
      type: 'linear',
      grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
      ticks: {
        color: '#4a6080',
        font: { family: 'JetBrains Mono', size: 10 },
        maxTicksLimit: 8
      },
      border: { color: '#1a2540' }
    },
    y: {
      grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
      ticks: {
        color: '#4a6080',
        font: { family: 'JetBrains Mono', size: 10 },
        maxTicksLimit: 6
      },
      border: { color: '#1a2540' }
    }
  }
};

function lineCfg(name, xArr, yArr, dash=[]) {
  return {
    label: LABELS[name] || name,
    data: xArr.map((x,i) => ({ x, y: yArr[i] })),
    borderColor: COLORS[name],
    backgroundColor: 'transparent',
    borderWidth: 1.8,
    pointRadius: 0,
    borderDash: dash,
    tension: 0.3,
  };
}

// ---- SPEED CHART ----
{
  const datasets = Order => {
    const ds = [];
    // Add reference (first controller)
    const ref = DATA['lqr-pid'];
    ds.push({
      label: 'Reference',
      data: ref.t.map((x,i) => ({ x, y: ref.speed_ref[i] })),
      borderColor: 'rgba(255,255,255,0.4)',
      borderWidth: 1.5,
      borderDash: [5,4],
      pointRadius: 0,
      tension: 0.3,
      backgroundColor: 'transparent',
    });
    for (const name of ORDER) {
      ds.push(lineCfg(name, DATA[name].t, DATA[name].speed_now));
    }
    return ds;
  };
  new Chart(document.getElementById('speedChart'), {
    type: 'line',
    data: { datasets: datasets() },
    options: { ...baseOpts, scales: { ...baseOpts.scales,
      x: { ...baseOpts.scales.x, title: { display: true, text: 't (s)', color: '#4a6080', font: { family: 'JetBrains Mono', size: 10 } } },
      y: { ...baseOpts.scales.y, title: { display: true, text: 'Speed (m/s)', color: '#4a6080', font: { family: 'JetBrains Mono', size: 10 } } },
    }}
  });
}

// ---- YAW ERROR CHART ----
{

    pointRadius: 0, tension: 0, backgroundColor: 'transparent',
  });

    datasets.push(lineCfg(name, DATA[name].t, DATA[name].yaw_err_deg));
  }

}

      ...baseOpts,
